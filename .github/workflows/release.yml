name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test Midnight.Installer.slnx

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="1.0.0"
          dotnet publish src/Midnight.Cli -c Release -r linux-${{ matrix.arch }} --self-contained \
            -p:PublishSingleFile=true -p:Version="$version" -o out
          mv out/midnight midnight-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-linux-${{ matrix.arch }}
          path: midnight-linux-${{ matrix.arch }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum midnight-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            midnight-linux-x64
            midnight-linux-arm64
            SHA256SUMS
          generate_release_notes: true
