<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Maintenance in progress</title>
  <noscript><meta http-equiv="refresh" content="30"></noscript>
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --border: #e4e7ec;
      --text: #101828;
      --muted: #667085;
      --brand: #465fff;
      --brand-soft: rgba(70, 95, 255, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e10;
        --card: #141416;
        --border: #232327;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --brand-soft: rgba(70, 95, 255, 0.16);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .logo { height: 36px; margin-bottom: 32px; }
    .logo-dark { display: none; }

    @media (prefers-color-scheme: dark) {
      .logo-light { display: none; }
      .logo-dark { display: inline; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px 32px;
      box-shadow: 0 12px 32px -16px rgba(16, 24, 40, 0.18);
    }

    .icon {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: var(--brand-soft);
      color: var(--brand);
      display: grid;
      place-items: center;
    }

    .icon svg { width: 30px; height: 30px; animation: spin 6s linear infinite; }

    .icon::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 22px;
      border: 2px solid var(--brand);
      opacity: 0;
      animation: pulse 2.4s ease-out infinite;
    }

    h1 { margin: 0 0 10px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }

    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

    .status {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f79009; animation: blink 1.6s ease-in-out infinite; }
    .status.back .dot { background: #12b76a; animation: none; }

    footer { margin-top: 24px; font-size: 12px; color: var(--muted); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.92); } 100% { opacity: 0; transform: scale(1.12); } }
    @keyframes blink { 50% { opacity: 0.35; } }

    @media (prefers-reduced-motion: reduce) {
      .icon svg, .icon::after, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo logo-light" src="/__maintenance/logo.png" alt="" onerror="this.remove()">
    <img class="logo logo-dark" src="/__maintenance/logo-dark.png" alt="" onerror="this.remove()">

    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </div>

      <h1>Maintenance in progress</h1>
      <p>This panel is being updated right now. It will be back in a few minutes – your servers keep running in the meantime.</p>

      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot"></span>
        <span id="status-text">Checking again in a moment…</span>
      </div>
    </div>

    <footer>This page reloads by itself as soon as the panel is back.</footer>
  </main>

  <script>
    (function () {
      var interval = 5;
      var remaining = interval;
      var text = document.getElementById("status-text");
      var status = document.getElementById("status");

      function check() {
        text.textContent = "Checking…";

        fetch("/api/health", { cache: "no-store", headers: { Accept: "application/json" } })
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (body) {
            if (body && body.status === "ok") {
              status.classList.add("back");
              text.textContent = "Back online – reloading…";
              setTimeout(function () { location.reload(); }, 600);
              return;
            }

            remaining = interval;
          })
          .catch(function () { remaining = interval; });
      }

      setInterval(function () {
        if (status.classList.contains("back")) return;

        remaining -= 1;

        if (remaining <= 0) check();
        else text.textContent = "Checking again in " + remaining + "s";
      }, 1000);
    })();
  </script>
</body>
</html>
